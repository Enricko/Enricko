    margin: 0;

    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #1f2328;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .gh-header {
    width: 100%;
    background: #24292f;
    color: #fff;
    padding: 14px 24px;
    box-sizing: border-box;
    text-align: center;
    font-size: 14px;
    opacity: 0.92;
  }
  .readme {
    width: 880px;
    max-width: 92vw;
    background: #fff;
    margin: 28px 0 60px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 24px;
    box-sizing: border-box;
  }
  .readme p { margin: 0 0 18px; text-align: center; }
  .readme img { vertical-align: middle; }
  a { color: #0969da; text-decoration: none; }
</style>
</head>
