name: Render README cards

# Redraws the snapshot cards in cards/ every night (00:17 WIB) with fresh
# contribution, repo and server data, and commits whatever changed.
#
# With the repository variable LIVE_BASE set (Settings > Secrets and
# variables > Actions > Variables), README.md points the cards that change at
# the live card server instead, and these snapshots are only the fallback:
# delete the variable and run this workflow to switch back to them.
on:
  schedule:
    - cron: "17 17 * * *" # 17:17 UTC daily = 00:17 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render cards + README
        run: |
          python scripts/render_readme_cards.py --refresh --rev "${GITHUB_SHA::7}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_BASE: ${{ vars.LIVE_BASE }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed; skipping commit."
          else
            git commit -m "chore: refresh README cards [skip ci]"
            git push
          fi
